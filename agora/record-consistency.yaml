# Record-consistency registry -- one fact, one home, one direction.
#
# Every fact that lives in more than one file declares here which copy is the
# SOURCE and which copies are DERIVED. `python -m agora_checks record-consistency`
# fails when a derived copy disagrees. Which copy is the source is a ruling per
# fact; the registry records it, the check cannot make it. A new duplicated fact
# lands here in the same commit that creates its second copy.

facts:
  - id: tier-table
    fact: the planning-tier table (Vision -> North star)
    mode: generated
    generator: tier_table
    source: agora/vocabulary.yaml
    targets: [.claude/skills/agora/SKILL.md, docs/method.md]

  - id: skill-table
    fact: the skill table (name, level, role, epithet) -- read from each SKILL.md
    mode: generated
    generator: skill_table
    source: .claude/skills
    targets: [.claude/skills/README.md]

  - id: policy-table
    fact: the policy table (name, domain, status, title) -- read from each policy file
    mode: generated
    generator: policy_table
    source: .claude/policies
    targets: [.claude/policies/README.md]

  - id: policy-four-eyes
    fact: the policy-four-eyes TL;DR, mirrored into the always-loaded CLAUDE.md
    mode: verbatim
    source: .claude/policies/policy-four-eyes.md
    heading: TL;DR
    targets: [CLAUDE.md]

  - id: policy-shoulder-glance
    fact: the policy-shoulder-glance TL;DR, mirrored into the always-loaded CLAUDE.md
    mode: verbatim
