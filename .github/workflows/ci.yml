name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Agora checks (frontmatter, record consistency, prose mass, domain share, shipped refs, links, secrets, catalogue)
        run: python -m agora_checks all
      - name: Tests
        run: python -m pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Demo
        run: python examples/demo.py
